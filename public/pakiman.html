<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <title>PAKIMAN</title>
        <link rel="stylesheet" href="./styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    </head>
    <body>
        <p id="estado-conexion" role="status" aria-live="polite">Conectando al servidor...</p>
        <button id="reintentar" hidden>Reintentar</button>
        <section id="seleccionar-bestia">
            <h1 class="titulo">Pakiman</h1>
            <h2 class="subtitulo">Elige a tu bestia, bro:</h2>

            <div id="contenedorTarjetas" class="tarjetas">
                
            </div>

            <button id="button-bestia" disabled>Seleccionar</button>
        </section>

        <section id="ver-mapa">
            <h2 class="subtitulo"> Recorre el mapa con tu pakiman, broster</h2>
            <canvas id="mapa"></canvas>
            <button data-direccion="arriba">Arriba</button>
            <div>
                <button data-direccion="izquierda">Izquierda</button>
                <button data-direccion="abajo">Abajo</button>
                <button data-direccion="derecha">Derecha</button>
            </div>
        </section>

        <section id="seleccionar-ataque">
            <h1 class="titulo">Pakiman</h1>
            <h2 class="subtitulo">Elige tu ataque, bro:</h2>

            <div id="contenedorAtaques" class="tarjetas-ataques">
                
            </div>
  
            <div id="mensajebro">
                <p id="resultado">Damn, bro, let's do it</p>

                <div id="reiniciar">
                    <button id="button-reiniciar">Reiniciar</button>
                </div>
            </div>

            <div class="ataques">

                <div class="ataques-jugador">
                    <P id="vidas-jugador">0</P>
                    <p id="bestia-jugador"></p>
                    <div id="ataque-del-jugador"></div>
                </div>

                <div class="ataques-enemigo">
                    <p id="vidas-enemigo">0</p>
                    <p id="bestia-enemigo"></p>
                    <div id="ataque-del-enemigo"></div>    
                </div>

            </div>

        </section>
        <script type="module" src="./JS/main.mjs"></script>
    </body>
</html>
